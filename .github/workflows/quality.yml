name: Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      
      - name: Lint
        working-directory: frontend
        run: npm run lint
      
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      
      - name: Run tests
        working-directory: frontend
        run: npm run test:ci

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtcbuilder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-django/requirements.txt
      
      - name: Install dependencies
        working-directory: backend-django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint with flake8
        working-directory: backend-django
        run: |
          flake8 . --count --statistics || true
      
      - name: Check formatting with black
        working-directory: backend-django
        run: |
          black --check . || true
      
      - name: Run tests
        working-directory: backend-django
        env:
          DB_NAME: vtcbuilder_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          DEBUG: "False"
        run: |
          pytest --verbose --tb=short || true

  e2e-playwright:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-quality]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtcbuilder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend-django/requirements.txt

      - name: Install backend dependencies
        working-directory: backend-django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations and setup test environment
        working-directory: backend-django
        env:
          DB_NAME: vtcbuilder_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          DEBUG: "False"
        run: |
          python manage.py migrate --noinput
          python manage.py setup_test_environment || true

      - name: Start backend
        working-directory: backend-django
        env:
          DB_NAME: vtcbuilder_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          DEBUG: "False"
        run: |
          python manage.py runserver 0.0.0.0:9495 &
          timeout 60 bash -c 'until curl -s http://localhost:9495/api/ > /dev/null; do sleep 2; done' || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9495
          PORT: "9494"
          CI: "true"
        run: |
          npm run dev &
          npx wait-on -t 120000 http://localhost:9494 || true

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:9494
        run: |
          npm run test:e2e -- --project=chromium

