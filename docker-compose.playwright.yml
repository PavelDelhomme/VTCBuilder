services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    container_name: vtcbuilder-playwright
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./playwright-report:/app/playwright-report
    environment:
      - PLAYWRIGHT_BASE_URL=http://vtcbuilder-frontend:3000
      - CI=true
    networks:
      - vtcbuilder_network
    command: sh -c "npm install && npx playwright install chromium && npx playwright test --reporter=html,json,list --project=chromium"

networks:
  vtcbuilder_network:
    external: true

