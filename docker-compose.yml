version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vtcbuilder-postgres
    environment:
      POSTGRES_DB: vtcbuilder
      POSTGRES_USER: vtcbuilder_user
      POSTGRES_PASSWORD: vtcbuilder_password
      # Optimisation: Réduire les connexions max et la mémoire partagée
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=fr_FR.UTF-8"
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=2GB
    ports:
      - "9496:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vtcbuilder_network
    # Optimisation: Limiter les ressources PostgreSQL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtcbuilder_user -d vtcbuilder"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vtcbuilder-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "9497:6379"
    volumes:
      - redis_data:/data
    networks:
      - vtcbuilder_network
    # Optimisation: Limiter les ressources Redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Django Backend API
  backend:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    image: vtcbuilder-backend:latest
    container_name: vtcbuilder-backend
    working_dir: /app
    volumes:
      - ./backend-django:/app
    # Ne pas monter le répertoire logs comme volume pour éviter les problèmes de permissions
    # Les logs seront dans le conteneur uniquement (utiliser docker logs pour les voir)
    # Optimisation: Limiter les ressources pour réduire la consommation
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      DB_ENGINE: django_tenants.postgresql_backend
      DB_NAME: vtcbuilder
      DB_USER: vtcbuilder_user
      DB_PASSWORD: vtcbuilder_password
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: django-insecure-change-this-in-production-key
      DEBUG: 1
      DJANGO_SETTINGS_MODULE: vtcbuilder.settings
      ALLOWED_HOSTS: "*"
      # Email SMTP Configuration (OVH Mail)
      EMAIL_HOST: ssl0.ovh.net
      EMAIL_PORT: 587
      EMAIL_USE_TLS: "True"
      EMAIL_USE_SSL: "False"
      EMAIL_HOST_USER: test@delhomme.ovh
      EMAIL_HOST_PASSWORD: t^^SAjZJ9!9kjPn#
      DEFAULT_FROM_EMAIL: noreply@vtcbuilder.com
      FRONTEND_URL: http://localhost:9494
    ports:
      - "9495:8000"  # Django sur le port 9495
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vtcbuilder_network

  # React/Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: vtcbuilder-frontend:latest
    container_name: vtcbuilder-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Ne pas monter .next en volume pour éviter les problèmes de cache corrompu
      # - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:9495
      # Augmenter la limite mémoire pour éviter les redémarrages
      - NODE_OPTIONS=--max-old-space-size=1024
    ports:
      - "9494:3000"  # Next.js sur le port 9494
    networks:
      - vtcbuilder_network
    # Augmenter les ressources frontend pour éviter les redémarrages
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M

  # PgAdmin (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vtcbuilder-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vtcbuilder.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "9498:80"
    depends_on:
      - postgres
    networks:
      - vtcbuilder_network

networks:
  vtcbuilder_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
