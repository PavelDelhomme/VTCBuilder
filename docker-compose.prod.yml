version: '3.8'

# Configuration de production - Override docker-compose.yml
services:
  backend:
    environment:
      DEBUG: 0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./backend-django:/app:ro  # Read-only en production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  # Production Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9495}

  postgres:
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=256MB -c max_connections=200

  # Supprimer PgAdmin en production
  pgadmin:
    profiles:
      - debug

volumes:
  postgres_prod_data:
